spring.application.name=USER-SERVICE
server.port=8081

# Database - SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=user_service;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=phuocga147
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Eureka Client
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# JWT
jwt.secret=your-secret-key-min-32-chars-long-for-security
jwt.expiration=86400000

# Logging
logging.level.org.springframework.web=DEBUG