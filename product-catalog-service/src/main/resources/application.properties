spring.application.name=PRODUCT-CATALOG-SERVICE
server.port=8082

# Database
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=product_catalog_service;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=phuocga147
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

#Hình ảnh
# ============================================
# File Upload Configuration
# ============================================
# Thư mục lưu ảnh trên server (đổi đường dẫn nếu cần)
app.upload.dir=S:/ProDev/web2/Web-2-Java 2/product-catalog-service/src/main/resources/images

# URL prefix để FE truy cập ảnh (qua API Gateway)
app.upload.url-prefix=http://localhost:8900/images

# Giới hạn kích thước file
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT
jwt.secret=your-secret-key-min-32-chars-long-for-security
jwt.expiration=86400000