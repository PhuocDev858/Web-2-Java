spring.application.name=order-service
server.port=8083

#database
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=order_service;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=phuocga147
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# JWT
jwt.secret=your-secret-key-min-32-chars-long-for-security
jwt.expiration=86400000
