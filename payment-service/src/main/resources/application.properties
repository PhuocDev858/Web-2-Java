# ============================================
# Payment Service Configuration
# ============================================
spring.application.name=PAYMENT-SERVICE
server.port=8814

# Database Configuration - SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=payment_service;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=phuocga147
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ============================================
# JPA / Hibernate Configuration
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ✅ Đổi sang SQL Server Dialect (thay vì MySQLDialect)
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ✅ Buộc Hibernate dùng đúng schema
spring.jpa.properties.hibernate.default_schema=dbo

# ============================================
# Eureka Client Configuration
# ============================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.healthcheck.enabled=true
